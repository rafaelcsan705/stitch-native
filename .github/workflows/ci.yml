name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m unittest discover -s tests -v
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: python3 stitch_native.py tokens fixtures/match-stats.html > Theme.swift
      - run: swiftc -typecheck -target arm64-apple-macos14 Theme.swift examples/MatchStatsView.swift
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10" }
      - run: mkdir -p ci/compose/src/main/kotlin
      - run: python3 stitch_native.py tokens-kotlin fixtures/match-stats.html > ci/compose/src/main/kotlin/Theme.kt
      - run: cp examples/MatchStatsScreen.kt ci/compose/src/main/kotlin/
      - run: gradle -p ci/compose compileKotlin
